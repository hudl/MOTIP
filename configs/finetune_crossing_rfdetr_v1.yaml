SUPER_CONFIG_PATH: ./configs/rfdetr_motip_hockey_stage2.yaml

# Dataset: crossing-focused sequences from golden_50
DATA_ROOT: /mnt/s3files/faceoff/tracking_workgroup/tracking_experiments/motip_crossing_dataset
DATASETS: [Hockey]
DATASET_SPLITS: [train]

NUM_CLASSES: 3

# No DETR pretrain — resuming from full hockey stage2 checkpoint
DETR_PRETRAIN:
RESUME_MODEL:
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False
RESUME_STATES: False

# Short fine-tune, lower LR to avoid catastrophic forgetting
EPOCHS: 13
LR: 2.0e-5
LR_WARMUP_EPOCHS: 0
LR_BACKBONE_SCALE: 0.05
SCHEDULER_MILESTONES: [10, 12]
SCHEDULER_GAMMA: 0.1

SAMPLE_INTERVALS: [4]
SAMPLE_LENGTHS: [20]

SAVE_CHECKPOINT_PER_EPOCH: 1

# Disable colour jitter and trajectory augmentations (same as D-DETR crossing finetune)
AUG_BRIGHTNESS: 0.0
AUG_CONTRAST: 0.0
AUG_SATURATION: 0.0
AUG_HUE: 0.0
AUG_TRAJECTORY_OCCLUSION_PROB: 0.0
AUG_TRAJECTORY_SWITCH_PROB: 0.0

# Inference
INFERENCE_DATASET:
INFERENCE_SPLIT: val
INFERENCE_MODE: submit

MISS_TOLERANCE: 60
DET_THRESH: 0.3
NEWBORN_THRESH: 0.6

EXP_NAME: rfdetr_crossing_finetune_v1
USE_WANDB: False
