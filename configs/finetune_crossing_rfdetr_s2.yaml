SUPER_CONFIG_PATH: ./configs/rfdetr_motip_hockey_stage2.yaml

# Dataset: crossing-focused sequences, s2 (clip-disjoint train/val, 49 clips each).
DATA_ROOT: /mnt/s3files/faceoff/tracking_workgroup/tracking_experiments/motip_crossing_dataset_s2
DATASETS: [Hockey]
DATASET_SPLITS: [train]

NUM_CLASSES: 3

# Resuming from the v1 RF-DETR crossing fine-tune checkpoint_12 (production model; passed via --resume-model).
DETR_PRETRAIN:
RESUME_MODEL:
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False
RESUME_STATES: False

# Frozen RF-DETR: only the trajectory FFN + ID decoder train. The detector runs in eval mode under
# no_grad and only its last-layer Hungarian matching is computed (no DETR losses).
DETR_FREEZE: True
# fp32 on purpose: vs fp32, bf16 query embeddings drift (mean cos 0.86-0.94, 6-8% of GT matches move
# to a different query), fp16 less so (cos 0.96-0.99, ~0.4%). Inference is FP32, so train on FP32 features.
DETR_FROZEN_AUTOCAST: none

# Short fine-tune, lower LR to avoid catastrophic forgetting
EPOCHS: 13
LR: 2.0e-5
LR_WARMUP_EPOCHS: 0
SCHEDULER_MILESTONES: [10, 12]
SCHEDULER_GAMMA: 0.1

# s2 sequences are short (median 43, p10 41 frames at stride 2), so a 40-frame window is ~the whole
# crossing; interval 1 because the sampler clamps anything larger on sequences this short.
SAMPLE_INTERVALS: [1]
SAMPLE_LENGTHS: [40]

# Sequences shorter than the window (crossings near a clip edge) become one whole-sequence sample
# instead of being dropped. Needs BATCH_SIZE 1.
SAMPLE_SHORT_SEQUENCES: whole

SAVE_CHECKPOINT_PER_EPOCH: 1

# Disable colour jitter and trajectory augmentations (same as D-DETR crossing finetune)
AUG_BRIGHTNESS: 0.0
AUG_CONTRAST: 0.0
AUG_SATURATION: 0.0
AUG_HUE: 0.0
AUG_TRAJECTORY_OCCLUSION_PROB: 0.0
AUG_TRAJECTORY_SWITCH_PROB: 0.0

# Validation on the held-out val split (1519 seqs x 28 frames); checkpoint_best.pth tracks val HOTA.
INFERENCE_DATASET: Hockey
INFERENCE_SPLIT: val
INFERENCE_MODE: evaluate
EVAL_PER_EPOCH: 1
EVAL_BEFORE_TRAIN: True
# Deterministic, evenly strided subset of the sorted val sequences (the same 150 every epoch), so a
# val pass stays well under an epoch. Final comparison is the full tracking_50 eval.
INFERENCE_MAX_SEQS: 150

MISS_TOLERANCE: 60
DET_THRESH: 0.3
NEWBORN_THRESH: 0.6

EXP_NAME: rfdetr_crossing_finetune_s2
USE_WANDB: False
