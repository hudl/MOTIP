SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_sportsmot.yaml

# Dataset: crossing-focused sequences at stride-1
DATA_ROOT: /mnt/s3files/faceoff/tracking_workgroup/tracking_experiments/motip_crossing_dataset_s1
DATASETS: [Hockey]
DATASET_SPLITS: [train]

NUM_CLASSES: 1

# Resume from stage2 hockey checkpoint
DETR_PRETRAIN:
RESUME_MODEL: /workspaces/sip-tracking-experiments/third_party/MOTIP/outputs/motip_amf_stage2_v1/stage2_g7e_checkpoint_12.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False
RESUME_STATES: False

# Training: same as v2 but adapted for stride-1 data
EPOCHS: 21
LR: 2.0e-5
LR_BACKBONE_SCALE: 0.05
SCHEDULER_MILESTONES: [18, 20]
SAVE_CHECKPOINT_PER_EPOCH: 1

# Sampling: stride-1 sequences, sample ~80 frames per clip
# SAMPLE_INTERVALS=1 means take every frame (already stride-1 in the data)
SAMPLE_INTERVALS: [1]
SAMPLE_LENGTHS: [60]
REL_PE_LENGTH: 60

# Inference settings
INFERENCE_DATASET:
INFERENCE_SPLIT: val
INFERENCE_MODE: submit

MISS_TOLERANCE: 60
DET_THRESH: 0.3
NEWBORN_THRESH: 0.6

# Outputs
OUTPUTS_DIR: /workspaces/sip-tracking-experiments/third_party/MOTIP/outputs/motip_crossing_finetune_s1
EXP_NAME: crossing_finetune_s1
USE_WANDB: False

# Disable augmentations (same as v2)
AUG_BRIGHTNESS: 0.0
AUG_CONTRAST: 0.0
AUG_SATURATION: 0.0
AUG_HUE: 0.0
AUG_TRAJECTORY_OCCLUSION_PROB: 0.0
AUG_TRAJECTORY_SWITCH_PROB: 0.0

# Use decoder checkpoint to save memory with longer sequences
USE_DECODER_CHECKPOINT: True
