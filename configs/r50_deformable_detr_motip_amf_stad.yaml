SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_sportsmot.yaml

DATASETS: [STADTracking]
DATASET_SPLITS: [train]

# No val split wired yet.
INFERENCE_DATASET:

# STAD plays are football clips; same 30-frame sample window as AMF.
SAMPLE_LENGTHS: [30, ]

# ~1700+ clips (dataset still being populated); stride 10 matches AMF v1 scale.
SAMPLE_STRIDE: 10
START_FRAME_FRACTION: 0.2  # only start from first 20% of each clip

# Initialised from AMF stage-1 DETR checkpoint via --detr-pretrain in the entrypoint.
DETR_PRETRAIN:

MISS_TOLERANCE: 30

# 8 epochs matches the effective AMF v1 run (5 initial + 3 resume = 8 total).
EPOCHS: 14
SCHEDULER_MILESTONES: [10, ]

MAX_TRACKS: 0
